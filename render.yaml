services:
  - type: web
    name: alpha-giddy-main
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: alpha-market-uploads
      mountPath: /uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CJ_DROPSHIPPING_API_KEY
        sync: false
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://alphamarket.name.ng/api/auth/google/callback
      - key: PUBLIC_APP_URL
        value: https://alphamarket.name.ng
      - key: PUBLIC_API_URL
        value: https://alpha-giddy-main.onrender.com
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: https://alphamarket.name.ng
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        value: "-1004418676694"
      - key: TELEGRAM_WEBHOOK_URL
        value: https://alpha-giddy-main.onrender.com/api/telegram/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: TASK_REWARDS_WEBHOOK_SECRET
        sync: false
      - key: TASK_REWARD_HOLD_THRESHOLD_NAIRA
        value: "3000"
      - key: PORT
        value: "10000"
